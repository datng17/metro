name: cronjob-cd-flow

# Deploys only when this service (or this file) changes on main-deployment.
# The Dockerfile copies only services/cronjob-service/, so the root pom.xml is not a trigger.
on:
  workflow_dispatch:
  push:
    branches: ["main-deployment"]
    paths:
      - "services/cronjob-service/**"
      - ".github/workflows/cronjob-service-cd.yml"

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  deploy:
    uses: ./.github/workflows/reusable-service-cd.yml
    with:
      service_dir: cronjob-service
      ecs_service: cronjob
