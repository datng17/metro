# Profile "aws": values come only from environment variables (ECS task definition / compose).
# Required: DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, API_KEY, TICKET_SERVICE_URL, STATION_SERVICE_URL
# cronjob-service has no Eureka client; other services reach it by URL (see gateway routes.cronjob-uri).
spring:
  application:
    name: cronjob-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 4010
  servlet:
    context-path: /api
service:
  # Base URLs, e.g. http://ticket-service:4005 / http://station-service:4004 (compose)
  # or http://ticket.metro.local:4005 / http://station.metro.local:4004 (ECS).
  tickets:
    url: ${TICKET_SERVICE_URL}/api/ts
  stations:
    url: ${STATION_SERVICE_URL}/api/stations
security:
  api:
    key: ${API_KEY}
    header: X-API-KEY
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
