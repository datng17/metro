spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/Bus}
  datasource:
    url: jdbc:postgresql://localhost:5432/metro_station_db?user=admin&password=admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 60000
    requested-heartbeat: 60

    # Publisher configuration (quan trọng cho producer)
    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true
      reply-timeout: 60000

server:
  port: 4004

security:
  api:

    key: ${API_KEY}
    header: X-API-KEY
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 3600000 # 1 hour in milliseconds

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
