spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/metro_order_db?user=admin&password=admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 4009

service:
  users:
    url: http://localhost:4005/api/ts/tickets

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

security:
  api:

    key: ${API_KEY}
    header: X-API-KEY
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 3600000 # 1 hour in milliseconds

paypal:
  client-id: ${PAYPAL_CLIENT_ID:dummy}
  client-secret: ${PAYPAL_CLIENT_SECRET:dummy}
  base-url: https://api-m.sandbox.paypal.com
  return-url: http://localhost:4008/api/payment/paypal/success
  cancel-url: http://localhost:4008/api/payment/paypal/cancel

stripe:
  secret: ${STRIPE_SECRET_KEY:dummy}
  publishable: ${STRIPE_PUBLISHABLE_KEY:dummy}
